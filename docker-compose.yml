name: bonsai

services:
  llama-server:
    build:
      context: .
      args:
        LLAMA_RELEASE: prism-b10709-9a9394a
        LLAMA_TARGET: ${LLAMA_TARGET:-linux-cuda-12.4-x64}
        BASE_IMAGE: ${BASE_IMAGE:-nvidia/cuda:12.4.1-runtime-ubuntu22.04}
    image: bonsai-llama-server:${LLAMA_RELEASE:-prism-b10709-9a9394a}
    container_name: bonsai-llama-server
    volumes:
      - ./models:/models:ro
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8081"
      - "--jinja"
      - "-c"
      - "${CONTEXT_LENGTH:-8192}"
      - "--n-gpu-layers"
      - "${NGPU:-99}"
      - "-m"
      - "/models/${MODEL_FILE:-Ternary-Bonsai-2-27B-PQ2_0.gguf}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # CPU-only fallback: set LLAMA_TARGET=ubuntu-x64, BASE_IMAGE=ubuntu:22.04
    # and remove the deploy block above (or set compose profile to none).

  proxy:
    build: ./proxy
    image: bonsai-proxy:latest
    container_name: bonsai-proxy
    ports:
      - "${PORT:-8080}:8080"
    command: ["llama-server", "8081"]
    depends_on:
      llama-server:
        condition: service_healthy
    restart: unless-stopped
    # Rewrites dry_penalty_last_n: -1 (sent by Open WebUI) into a value the
    # llama.cpp schema accepts, then forwards to llama-server on :8081.